[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ashare-daily"
version = "0.1.0"
description = "Daily A-share pool, regime, and adaptive HTML commands"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "qlib",
  "pandas",
  "numpy",
  "plotly",
  "scipy",
  "skfolio",
  "arch",
  "statsmodels",
]

[project.scripts]
ashare-daily = "ashare_daily.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
